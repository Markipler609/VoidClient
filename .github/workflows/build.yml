name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
          - os: macos-14
            args: --mac --x64
          - os: macos-14
            args: --mac --arm64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mc-launcher/package-lock.json

      - name: Install dependencies
        working-directory: mc-launcher
        run: npm ci

      - name: Build (${{ matrix.os }})
        working-directory: mc-launcher
        run: npx electron-builder --publish never ${{ matrix.args }}

      - name: Collect release assets
        shell: bash
        working-directory: mc-launcher
        run: |
          V=$(node -p "require('./package.json').version")
          cd dist
          mkdir -p "$GITHUB_WORKSPACE/assets_release"
          cp "VOID CLIENT $V.exe" "$GITHUB_WORKSPACE/assets_release/VOID_Launcher.exe" 2>/dev/null || true
          cp "VOID CLIENT Setup $V.exe" "$GITHUB_WORKSPACE/assets_release/VOID_Client_Setup_$V.exe" 2>/dev/null || true
          cp "void-client-$V.tar.gz" "$GITHUB_WORKSPACE/assets_release/void-client-$V.tar.gz" 2>/dev/null || true
          cp VOID_Client_$V-*.dmg "$GITHUB_WORKSPACE/assets_release/" 2>/dev/null || true
          cp VOID_Client_$V-*.zip "$GITHUB_WORKSPACE/assets_release/" 2>/dev/null || true
          ls -la "$GITHUB_WORKSPACE/assets_release"

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: "assets_release/*"
          generate_release_notes: true
          fail_on_unmatched_assets: false